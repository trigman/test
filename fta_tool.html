<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FTA Professional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        .link { fill: none; stroke: #4a5568; stroke-width: 2px; shape-rendering: crispEdges; }
        .node-box { fill: white; stroke: #2d3748; stroke-width: 1.5px; }
        .node-header { stroke: #2d3748; stroke-width: 1px; }
        .node-id-text { fill: black; font-size: 10px; font-weight: bold; text-transform: uppercase; } 
        .node-desc-text { fill: #2d3748; font-size: 9px; font-weight: 500; }
        .gate-and { fill: #feb2b2; stroke: #c53030; stroke-width: 1.5px; }
        .gate-or { fill: #bee3f8; stroke: #2b6cb0; stroke-width: 1.5px; }
        .gate-basic { fill: #e2e8f0; stroke: #4a5568; stroke-width: 1.5px; }
        .gate-text { font-size: 8px; font-weight: 900; fill: #2d3748; pointer-events: none; }
        .cutset-line { stroke: #e53e3e; stroke-width: 1.5px; stroke-dasharray: 3,3; }
        .cutset-text { fill: #c53030; font-size: 8px; font-weight: bold; }
        #canvas-container { background: #edf2f7; height: calc(100vh - 64px); width: 100%; }
    </style>
</head>
<body class="flex flex-col">

    <nav class="h-16 bg-gray-900 text-white flex items-center justify-between px-6 shadow-xl z-50">
        <div class="flex items-center space-x-4">
            <span class="font-black text-xl tracking-tighter text-blue-400">FTA PRO</span>
            <div id="status-pill" class="text-[10px] px-2 py-0.5 rounded font-bold bg-gray-800 text-gray-500 uppercase tracking-widest">Standalone</div>
        </div>
        
        <div class="flex space-x-3">
            <button id="btn-sample" class="bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-2 px-4 rounded transition border border-gray-500">
                Sample
            </button>
            <button id="btn-sync" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-4 rounded transition shadow-lg">
                Sync Excel
            </button>
        </div>
    </nav>

    <main id="canvas-container" class="relative">
        <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 animate-pulse">
            <svg class="w-12 h-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 002-2h2a2 2 0 002 2"></path></svg>
            <p>Ready to visualize</p>
        </div>
        <svg id="main-svg" class="w-full h-full"></svg>
    </main>

    <script>
        // Sample data for fallback and structure reference
        const sampleRows = [
            ["FTA ID", "Event ID", "Parent", "Type", "Label", "ASIL", "Cutset ID", "Cutset Desc"],
            ["FFTA1", "SG1", "", "AND", "Violation of SG1: Prevent unintended acceleration above driver request.", "ASIL D", "", ""],
            ["FFTA1", "E1", "SG1", "BASIC", "e-stop fails", "ASIL C (D)", "FSR1.1", "The e-stop (safety mechanism independent from VCU) shall return the vehicle to the safe state of zero torque"],
            ["FFTA1", "E2", "SG1", "OR", "MCU receives torque request unintended by driver", "ASIL A(D)", "FSR1.2", "MCU shall not provide torque if not commanded by driver"],
            ["FFTA1", "E3", "E2", "BASIC", "implausible or invalid accelerator pedal signal", "ASIL A(D)", "FSR1.3", "The VCU shall detect implausible or invalid accelerator pedal position input within the Fault Tolerant Time Interval (FTTI)."],
            ["FFTA1", "E4", "E2", "BASIC", "brake interlock fails", "ASIL A(D)", "FSR1.4", "VCU commands 0 torque when brake pedal applied"],
            ["FFTA1", "E5", "E2", "BASIC", "loss or corruption of communication results in unintended torque command", "ASIL A(D)", "FSR1.5", "MCU loss of CAN signal triggers timeout to 0 torque safe state within FTTI"]
        ];

        let officeLoaded = false;

        window.onload = () => {
            document.getElementById('btn-sample').onclick = () => renderData(sampleRows);
            document.getElementById('btn-sync').onclick = handleExcelSync;
        };

        /**
         * Loads the Office.js library if not already loaded, and then performs Excel readiness checks.
         */
        async function handleExcelSync() {
            if (!officeLoaded) {
                console.log("DEBUG: Office.js not loaded. Attaching script.");
                updateStatus("Loading Excel API...", "bg-gray-600 text-white");
                const script = document.createElement('script');
                script.src = "https://appsforoffice.microsoft.com/lib/1/hosted/office.js";
                script.onload = () => {
                    Office.onReady((info) => {
                        officeLoaded = true;
                        updateStatus("Excel API Ready", "bg-green-500 text-white");
                        console.log("DEBUG: Office.js and Office.onReady completed.", info);
                        performExcelRead();
                    });
                };
                script.onerror = () => {
                     updateStatus("API Load Error", "bg-red-500 text-white");
                     console.error("ERROR: Failed to load Office.js from CDN.");
                }
                document.head.appendChild(script);
            } else {
                console.log("DEBUG: Office.js already loaded. Proceeding to read Excel.");
                performExcelRead();
            }
        }

        /**
         * Reads data from Excel, prioritizing a table named "FTA_Data" and filtering by "FFTA1".
         */
        async function performExcelRead() {
            updateStatus("Reading Excel...", "bg-yellow-500 text-black");
            console.log("DEBUG: Starting Excel.run context.");

            try {
                await Excel.run(async (context) => {
                    const worksheet = context.workbook.worksheets.getActiveWorksheet();
                    let rangeToRead;
                    const targetFtaId = "FFTA1"; // Using sample ID for current debug

                    // 1. Attempt to find and use a Table named 'FTA_Data'
                    let table = worksheet.tables.getItemOrNullObject("FTA_Data");
                    table.load("name, range");
                    await context.sync();

                    if (!table.isNullObject) {
                        // Read the entire table range (including headers)
                        rangeToRead = table.range; 
                        console.log(`DEBUG: Found and reading data from table: ${table.name}`);
                        updateStatus(`Reading Table: ${table.name}`, "bg-green-500 text-white");
                    } else {
                        // 2. Fallback: Read the entire used range of the active worksheet
                        rangeToRead = worksheet.getUsedRange();
                        console.log("DEBUG: Table 'FTA_Data' not found. Reading used range of active sheet.");
                        updateStatus("Reading Used Range...", "bg-indigo-500 text-white");
                    }
                    
                    rangeToRead.load("values");
                    await context.sync();

                    const values = rangeToRead.values;
                    
                    if (!values || values.length < 2) {
                        updateStatus("Data Empty", "bg-red-500 text-white");
                        console.error("ERROR: Range is empty or only contains a header row.");
                        return;
                    }
                    
                    console.log(`DEBUG: Successfully read ${values.length} rows from Excel.`);
                    
                    const header = values[0]; 
                    let filteredValues = [header]; 
                    
                    const dataRows = values.slice(1);
                    const filteredData = dataRows.filter(row => 
                        // Check if the FTA ID column (index 0) matches the target ID (case-insensitive and trimmed)
                        row.length > 0 && String(row[0] || "").trim().toUpperCase() === targetFtaId.toUpperCase()
                    );
                    
                    filteredValues = filteredValues.concat(filteredData);
                    
                    console.log(`DEBUG: Filtered data by FTA ID '${targetFtaId}'. Total rows to render: ${filteredValues.length}`);
                    console.log("DEBUG: First 3 rows of filtered data (check for whitespace/empty parent ID on root):", filteredValues.slice(0, 3)); 

                    if (filteredValues.length <= 1) {
                        updateStatus(`No Data for ID: ${targetFtaId}`, "bg-red-500 text-white");
                        console.warn(`WARNING: No valid data rows found for FTA ID '${targetFtaId}'.`);
                    } else {
                        renderData(filteredValues);
                        updateStatus(`Rendered ${filteredValues.length - 1} Events (FTA ID: ${targetFtaId})`, "bg-green-600 text-white");
                    }
                });
            } catch (error) {
                console.error("Excel Runtime Error:", error);
                updateStatus("Excel Error", "bg-red-600 text-white");
            }
        }

        function updateStatus(text, classes) {
            const pill = document.getElementById('status-pill');
            pill.innerText = text;
            pill.className = `text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-widest ${classes}`;
        }

        function getAsilColor(asil) {
            if (!asil) return "#718096";
            const a = asil.toUpperCase();
            if (a.includes("ASIL D")) return "#e53e3e";
            if (a.includes("ASIL C")) return "#ed8936";
            if (a.includes("ASIL B")) return "#ecc94b";
            if (a.includes("ASIL A")) return "#4299e1";
            return "#a0aec0";
        }


        function wrapText(text, width, charWidth = 5) {
            if (!text) return [];
            const words = text.split(/\s+/);
            const lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                if ((currentLine + " " + words[i]).length * charWidth < width) {
                    currentLine += " " + words[i];
                } else {
                    lines.push(currentLine);
                    currentLine = words[i];
                }
            }
            lines.push(currentLine);
            return lines;
        }

        function renderData(rows) {
            if (!rows || rows.length < 2) return;
            document.getElementById('empty-state').classList.add('hidden');
            const svg = d3.select("#main-svg");
            svg.selectAll("*").remove();

            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            const g = svg.append("g");

            svg.call(d3.zoom().scaleExtent([0.1, 2]).on("zoom", (e) => g.attr("transform", e.transform)));

            const data = rows.slice(1).map(r => {
                const parentIdRaw = String(r[2] || "").trim();
                
                // CRITICAL FIX: Explicitly use null for the root node's parent ID 
                // to avoid issues with whitespace/invisible characters from Excel.
                const parentId = parentIdRaw === "" ? null : parentIdRaw;
                
                return { 
                    id: String(r[1]), 
                    parentId: parentId,
                    type: (r[3] || 'BASIC').toUpperCase(), 
                    label: String(r[4] || r[1]),
                    asil: String(r[5] || ""),
                    cutsetId: String(r[6] || ""),
                    cutsetDesc: String(r[7] || "")
                };
            });
            
            console.log("DEBUG: Data array ready for d3.stratify(). Root parentId check:", data[0]);

            // D3 Stratify will now correctly identify the root node via parentId: null
            const root = d3.stratify().id(d => d.id).parentId(d => d.parentId)(data);
            const treeLayout = d3.tree().nodeSize([250, 220]);
            treeLayout(root);

            g.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d => {
                    const midY = (d.source.y + d.target.y) / 2;
                    return `M${d.source.x},${d.source.y} L${d.source.x},${midY} L${d.target.x},${midY} L${d.target.x},${d.target.y}`;
                });

            const node = g.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.x},${d.y})`);

            // Logic Gates Drawing (Only if has children)
            node.each(function(d) {
                const el = d3.select(this);

                // Only draw gates for non-leaf nodes
                if (!d.children || d.children.length === 0) {
                    return; 
                }

                const type = d.data.type;
                const gateYOffset = 65; 

                if (type === 'AND') {
                    el.append("path")
                      .attr("class", "gate-and")
                      .attr("d", "M-15,15 L15,15 L15,0 A15,15 0 0,0 -15,0 Z")
                      .attr("transform", `translate(0, ${gateYOffset})`);
                    el.append("text")
                      .attr("class", "gate-text")
                      .attr("text-anchor", "middle")
                      .attr("y", gateYOffset + 3)
                      .text("AND");
                } else if (type === 'OR') {
                    el.append("path")
                      .attr("class", "gate-or")
                      .attr("d", "M-15,15 Q-15,-10 0,-15 Q15,-10 15,15 Q0,7 -15,15 Z")
                      .attr("transform", `translate(0, ${gateYOffset})`);
                    el.append("text")
                      .attr("class", "gate-text")
                      .attr("text-anchor", "middle")
                      .attr("y", gateYOffset + 3)
                      .text("OR");
                }
            });

            // Event Box Dimensions
            const boxW = 160;
            const boxH = 65;
            const headerH = 15;
            const borderRadius = 6; 

            // Draw the main event box background
            node.append("rect")
                .attr("class", "node-box")
                .attr("width", boxW)
                .attr("height", boxH)
                .attr("x", -boxW/2)
                .attr("y", -boxH/2)
                .attr("rx", borderRadius) 
                .attr("ry", borderRadius); 

            // Draw the colored ASIL header
            node.append("rect")
                .attr("class", "node-header")
                .attr("width", boxW)
                .attr("height", headerH)
                .attr("x", -boxW/2)
                .attr("y", -boxH/2)
                // Use custom path to clip the top corners for the header bar
                .attr("d", `M${-boxW/2 + borderRadius},${-boxH/2} L${boxW/2 - borderRadius},${-boxH/2} A${borderRadius},${borderRadius} 0 0 1 ${boxW/2},${-boxH/2 + borderRadius} L${boxW/2},${-boxH/2 + headerH} L${-boxW/2},${-boxH/2 + headerH} L${-boxW/2},${-boxH/2 + borderRadius} A${borderRadius},${borderRadius} 0 0 1 ${-boxW/2 + borderRadius},${-boxH/2} Z`)
                .attr("fill", d => getAsilColor(d.data.asil));

            // Draw the header text (ID and ASIL)
            node.append("text")
                .attr("class", "node-id-text") 
                .attr("text-anchor", "start")
                .attr("x", -boxW/2 + 5)
                .attr("y", -boxH/2 + 11)
                .text(d => `${d.data.id} : ${d.data.asil || 'QM'}`);

            // Draw the main event description (wrapped text)
            node.each(function(d) {
                const el = d3.select(this);
                const lines = wrapText(d.data.label, boxW - 15, 5.5);
                lines.slice(0, 4).forEach((line, i) => {
                    el.append("text")
                      .attr("class", "node-desc-text")
                      .attr("text-anchor", "start")
                      .attr("x", -boxW/2 + 5)
                      .attr("y", -boxH/2 + headerH + 12 + (i * 11))
                      .text(line);
                });
            });

            // Cutset Visualization (Wrapped and Left Aligned)
            node.each(function(d) {
                if (d.data.cutsetId) {
                    const el = d3.select(this);
                    const lineY = -boxH/2 - 60;
                    const startX = -boxW/2 - 40;
                    
                    // The line crosses from above left to just past the center vertical branch
                    el.append("line")
                      .attr("class", "cutset-line")
                      .attr("x1", startX)
                      .attr("y1", lineY)
                      .attr("x2", 10)
                      .attr("y2", lineY);
                    
                    const fullText = `${d.data.cutsetId}: ${d.data.cutsetDesc}`;
                    const wrapLimit = Math.abs(startX) + 5; 
                    const cutsetLines = wrapText(fullText, wrapLimit, 4.8);

                    cutsetLines.forEach((line, i) => {
                        el.append("text")
                          .attr("class", "cutset-text")
                          .attr("text-anchor", "start")
                          .attr("x", startX + 2)
                          .attr("y", lineY + 10 + (i * 9))
                          .text(line);
                    });
                }
            });

            const transform = d3.zoomIdentity.translate(width/2, 100).scale(0.7);
            svg.transition().duration(500).call(d3.zoom().transform, transform);
        }
    </script>
</body>
</html>

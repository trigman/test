<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FTA Live Visualizer</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .node rect { fill: #2d3748; stroke: #4a5568; stroke-width: 1px; rx: 4; ry: 4; }
        .node text { font: 11px sans-serif; fill: #fff; pointer-events: none; }
        .link { fill: none; stroke: #cbd5e0; stroke-width: 2px; }
        .gate-label { font-size: 10px; font-weight: bold; fill: #2d3748; }
        #diagram-container { height: 500px; background: #f7fafc; border-radius: 8px; cursor: grab; }
        #diagram-container:active { cursor: grabbing; }
    </style>
</head>
<body class="p-4 bg-gray-100 font-sans">
    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl overflow-hidden border border-gray-200">
        <!-- Header -->
        <div class="p-4 bg-gray-800 text-white flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold">FTA Live Editor</h1>
                <p class="text-xs opacity-75">Visualizing Fault Tree Structures</p>
            </div>
            <div class="flex items-center space-x-2 bg-gray-700 p-1 rounded-lg">
                <button id="mode-excel" class="px-3 py-1 text-xs rounded btn-mode-active bg-blue-500">Excel</button>
                <button id="mode-debug" class="px-3 py-1 text-xs rounded hover:bg-gray-600 transition">Debug/Sample</button>
            </div>
        </div>
        
        <div class="flex flex-col md:flex-row h-full">
            <!-- Sidebar Controls -->
            <div class="w-full md:w-64 p-4 border-r border-gray-200 bg-gray-50 space-y-4">
                <div id="excel-controls">
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Excel Integration</label>
                    <button id="sync-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 px-4 rounded shadow-sm transition">
                        Sync Selection
                    </button>
                </div>

                <div id="debug-controls" class="hidden space-y-3">
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Debug Mode</label>
                    <button id="load-sample" class="w-full bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-2 px-4 rounded transition shadow-sm">
                        Load Sample Data
                    </button>
                    <textarea id="manual-input" class="w-full h-32 text-xs p-2 border rounded font-mono" placeholder="ID,ParentID,Type,Label..."></textarea>
                    <button id="render-manual" class="w-full bg-gray-800 text-white text-xs py-1 rounded">Render Manual</button>
                </div>

                <div class="pt-4 border-t border-gray-200">
                    <div id="status-message" class="p-3 text-xs rounded-lg bg-gray-200 text-gray-700 break-words">
                        Waiting for input...
                    </div>
                </div>
            </div>

            <!-- Visualization Canvas -->
            <div class="flex-1 p-4 bg-white">
                <div id="diagram-container" class="relative border border-gray-300 overflow-hidden shadow-inner">
                    <svg id="fta-svg" class="w-full h-full"></svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'excel';
        const sampleData = [
            ["ID", "ParentID", "Type", "Label"],
            ["TOP", "", "OR", "Violation of SG_001"],
            ["E1", "TOP", "AND", "APP signal error"],
            ["E2", "TOP", "OR", "AP/BRK interlock fail"],
            ["E3", "E1", "AND", "VCU APP check fail"],
            ["E4", "E1", "BASIC", "FSCU APP check fail"],
            ["E5", "E2", "BASIC", "MCU cross check fail"]
        ];

        Office.onReady((info) => {
            setupUI();
        });

        function setupUI() {
            document.getElementById("mode-excel").onclick = () => switchMode('excel');
            document.getElementById("mode-debug").onclick = () => switchMode('debug');
            document.getElementById("sync-button").onclick = syncFromExcel;
            document.getElementById("load-sample").onclick = () => processData(sampleData);
            document.getElementById("render-manual").onclick = renderFromTextarea;

            // Initialize Zoom
            const svg = d3.select("#fta-svg");
            const g = svg.append("g").attr("class", "main-g");
            
            const zoom = d3.zoom()
                .scaleExtent([0.1, 3])
                .on("zoom", (event) => g.attr("transform", event.transform));
            
            svg.call(zoom);
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('excel-controls').classList.toggle('hidden', mode !== 'excel');
            document.getElementById('debug-controls').classList.toggle('hidden', mode !== 'debug');
            document.getElementById('mode-excel').classList.toggle('bg-blue-500', mode === 'excel');
            document.getElementById('mode-debug').classList.toggle('bg-blue-500', mode === 'debug');
            updateStatus(`Switched to ${mode} mode.`);
        }

        function updateStatus(msg, isError = false) {
            const el = document.getElementById("status-message");
            el.innerText = msg;
            el.className = `p-3 text-xs rounded-lg ${isError ? 'bg-red-100 text-red-700' : 'bg-blue-50 text-blue-700'}`;
        }

        async function syncFromExcel() {
            updateStatus("Reading Excel...");
            try {
                await Excel.run(async (context) => {
                    const range = context.workbook.getSelectedRange();
                    range.load("values");
                    await context.sync();
                    processData(range.values);
                });
            } catch (error) {
                updateStatus("Excel Error: " + error.message, true);
            }
        }

        function renderFromTextarea() {
            const text = document.getElementById("manual-input").value;
            const rows = text.split('\n').map(line => line.split(',').map(cell => cell.trim()));
            processData(rows);
        }

        function processData(rows) {
            if (!rows || rows.length < 2) {
                updateStatus("Insufficient data selected.", true);
                return;
            }
            
            // Map table to objects
            const data = rows.slice(1).filter(r => r[0]).map(r => ({
                id: String(r[0]),
                parentId: String(r[1]),
                type: String(r[2] || 'OR').toUpperCase(),
                label: String(r[3] || '')
            }));

            updateDiagram(data);
        }

        function updateDiagram(data) {
            const svg = d3.select("#fta-svg");
            const g = svg.select(".main-g");
            g.selectAll("*").remove();

            // Build hierarchy
            const dataMap = {};
            data.forEach(d => dataMap[d.id] = {...d, children: []});

            let rootNode = null;
            data.forEach(d => {
                const node = dataMap[d.id];
                if (!d.parentId || d.parentId === "" || !dataMap[d.parentId]) {
                    rootNode = node;
                } else {
                    dataMap[d.parentId].children.push(node);
                }
            });

            if (!rootNode) {
                updateStatus("Root node not found!", true);
                return;
            }

            const width = document.getElementById("diagram-container").clientWidth;
            const height = 500;

            const hierarchy = d3.hierarchy(rootNode);
            const treeLayout = d3.tree().nodeSize([160, 100]);
            treeLayout(hierarchy);

            // Center the tree
            g.attr("transform", `translate(${width/2}, 50)`);

            // Links
            g.selectAll(".link")
                .data(hierarchy.links())
                .enter()
                .append("path")
                .attr("class", "link")
                .attr("d", d3.linkVertical()
                    .x(d => d.x)
                    .y(d => d.y));

            // Nodes
            const nodes = g.selectAll(".node")
                .data(hierarchy.descendants())
                .enter()
                .append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.x},${d.y})`);

            // Box
            nodes.append("rect")
                .attr("width", 120)
                .attr("height", 40)
                .attr("x", -60)
                .attr("y", -20);

            // Label
            nodes.append("text")
                .attr("text-anchor", "middle")
                .attr("y", 0)
                .text(d => d.data.label.length > 15 ? d.data.label.substring(0,12)+'...' : d.data.label);

            // Gate Symbol
            nodes.append("text")
                .attr("class", "gate-label")
                .attr("text-anchor", "middle")
                .attr("y", 35)
                .text(d => d.data.type);

            updateStatus(`Successfully rendered ${data.length} components.`);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FTA Live Visualizer</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .node circle { fill: #fff; stroke: #4a5568; stroke-width: 2px; }
        .node text { font: 12px sans-serif; }
        .link { fill: none; stroke: #cbd5e0; stroke-width: 2px; }
        .gate-and { fill: #f56565; }
        .gate-or { fill: #4299e1; }
        #diagram-container { min-height: 400px; background: #f7fafc; border-radius: 8px; }
    </style>
</head>
<body class="p-4 bg-gray-50">
    <div class="max-w-md mx-auto bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="p-4 border-b">
            <h1 class="text-xl font-bold text-gray-800">FTA Live Visualizer</h1>
            <p class="text-sm text-gray-500">Select your FTA table and click Sync.</p>
        </div>
        
        <div class="p-4 space-y-4">
            <div id="status-message" class="p-2 text-xs rounded bg-blue-50 text-blue-700 hidden"></div>
            
            <button id="sync-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-200 shadow">
                Sync Selection
            </button>

            <div id="diagram-container" class="relative border-2 border-dashed border-gray-200 flex items-center justify-center overflow-auto">
                <div id="placeholder-text" class="text-gray-400 text-center p-10">
                    <p>Diagram will appear here</p>
                    <p class="text-xs mt-2">Ensure your first row is the 'Top Event'</p>
                </div>
                <svg id="fta-svg"></svg>
            </div>
        </div>
    </div>

    <script>
        Office.onReady((info) => {
            if (info.host === Office.HostType.Excel) {
                document.getElementById("sync-button").onclick = syncData;
            }
        });

        async function syncData() {
            const status = document.getElementById("status-message");
            status.innerText = "Syncing...";
            status.classList.remove("hidden");

            try {
                await Excel.run(async (context) => {
                    const range = context.workbook.getSelectedRange();
                    range.load("values");
                    await context.sync();

                    const rows = range.values;
                    if (rows.length < 2) {
                        throw new Error("Please select at least two rows (Header + Data).");
                    }

                    // Process rows into a hierarchical structure
                    // Assuming columns: ID, ParentID, Type, Label
                    const data = rows.slice(1).map(r => ({
                        id: String(r[0]),
                        parentId: String(r[1]),
                        type: String(r[2]),
                        label: String(r[3])
                    }));

                    status.innerText = `Synced ${data.length} components. Building diagram...`;
                    updateDiagram(data);
                });
            } catch (error) {
                status.innerText = "Error: " + error.message;
                status.classList.replace("bg-blue-50", "bg-red-50");
                status.classList.replace("text-blue-700", "text-red-700");
            }
        }

        function updateDiagram(data) {
            const container = document.getElementById("diagram-container");
            const svg = d3.select("#fta-svg");
            const placeholder = document.getElementById("placeholder-text");
            
            // Clear previous diagram
            svg.selectAll("*").remove();
            placeholder.classList.add("hidden");

            // Build hierarchy
            const dataMap = data.reduce((map, node) => {
                map[node.id] = { ...node, children: [] };
                return map;
            }, {});

            let rootNode = null;
            data.forEach(node => {
                if (!node.parentId || node.parentId === "" || node.parentId === "null" || !dataMap[node.parentId]) {
                    rootNode = dataMap[node.id];
                } else {
                    dataMap[node.parentId].children.push(dataMap[node.id]);
                }
            });

            if (!rootNode) {
                document.getElementById("status-message").innerText = "Error: No root (Top Event) found.";
                placeholder.classList.remove("hidden");
                return;
            }

            const width = container.clientWidth || 400;
            const height = 400;

            const root = d3.hierarchy(rootNode);
            const treeLayout = d3.tree().size([width - 100, height - 100]);
            treeLayout(root);

            const g = svg.attr("width", width)
                       .attr("height", height)
                       .append("g")
                       .attr("transform", "translate(50,50)");

            // Draw links
            g.selectAll(".link")
                .data(root.links())
                .enter()
                .append("path")
                .attr("class", "link")
                .attr("d", d3.linkVertical().x(d => d.x).y(d => d.y));

            // Draw nodes
            const node = g.selectAll(".node")
                .data(root.descendants())
                .enter()
                .append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.x},${d.y})`);

            node.append("circle")
                .attr("r", 20)
                .attr("class", d => d.data.type.toLowerCase() === 'and' ? 'gate-and' : 'gate-or');

            node.append("text")
                .attr("dy", ".35em")
                .attr("y", 30)
                .attr("text-anchor", "middle")
                .text(d => d.data.label || d.data.id);
            
            document.getElementById("status-message").innerText = "Diagram Updated Successfully.";
        }
    </script>
</body>
</html>

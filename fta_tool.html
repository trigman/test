<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FTA Tool v1.9 - Layout Fixes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        .link { fill: none; stroke: #94a3b8; stroke-width: 2px; shape-rendering: crispEdges; }
        .node-box { fill: white; stroke: #2d3748; stroke-width: 0px; filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.2));}
        .node-header { stroke: #2d3748; stroke-width: 0px; filter: drop-shadow(0px 2px 0px rgba(0, 0, 0, 0.3)); }
        .node-id-text { fill: white; font-size: 10px; font-weight: bold; text-transform: uppercase; } 
        .node-desc-text { fill: #2d3748; font-size: 9px; font-weight: 500; }
        .gate-and { fill: #feb2b2; stroke: #ef9191; stroke-width: 1.5px; filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.2)); }
        .gate-or { fill: #bee3f8; stroke: #8cc4ff; stroke-width: 1.5px;filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.2)); }
        .gate-basic { fill: #e2e8f0; stroke: #4a5568; stroke-width: 1.5px; }
        .gate-text { font-size: 8px; font-weight: 900; fill: #2d3748; pointer-events: none; }
        .cutset-line { stroke: #e53e3e; stroke-width: 1.5px; stroke-dasharray: 3,3; }
        .cutset-text { fill: #c53030; font-size: 8px; font-weight: bold; }
        /* Adjusted height for the new two-row nav structure (approx 92px total height) */
        #canvas-container { background: #edf2f7; height: calc(100vh - 92px); width: 100%; }
    </style>
</head>
<body class="flex flex-col">

    <!-- NAVIGATION BAR: Updated to two rows -->
    <nav class="bg-gray-900 text-white flex flex-col px-6 shadow-xl z-50 py-3">
        
        <!-- ROW 1: Title, Status, Sample Button -->
        <div class="flex items-center justify-between h-8 mb-2">
            <div class="flex items-center space-x-4">
                <!-- Title: Smaller (text-lg) -->
                <span class="font-black text-lg tracking-tighter text-blue-400">FTA Tool v1.9</span>
                <!-- Status Pill: Now using text-[6px] and px-0.5 for further size reduction -->
                <div id="status-pill" class="text-xs px-0.5 py-0 rounded bg-gray-800 text-gray-500">Standalone</div>
            </div>
            
            <!-- Sample Button (Moved to Row 1) -->
            <button id="btn-sample" class="bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-1.5 px-3 rounded transition border border-gray-500">
                Sample
            </button>
        </div>
        
        <!-- ROW 2: Sync Button and Dropdowns -->
        <div class="flex items-center space-x-4 h-8">
            <!-- Sync Button -->
            <button id="btn-sync" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-1.5 px-3 rounded transition shadow-lg">
                Sync Excel
            </button>
            
            <!-- Table Selection Dropdown -->
            <label for="table-select" class="text-xs font-medium text-gray-300">Data Table:</label>
            <select id="table-select" class="bg-gray-800 text-white text-sm py-1 px-3 rounded cursor-pointer border border-gray-700 focus:ring-blue-500 focus:border-blue-500 w-48">
                <option value="">-- No Tables Loaded --</option>
            </select>

            <!-- FTA ID Selection Dropdown -->
            <label for="fta-id-select" class="text-xs font-medium text-gray-300">FTA ID:</label>
            <select id="fta-id-select" class="bg-gray-800 text-white text-sm py-1 px-3 rounded cursor-pointer border border-gray-700 focus:ring-blue-500 focus:border-blue-500 w-32">
                <option value="">-- Loading --</option>
            </select>
        </div>
    </nav>

    <main id="canvas-container" class="relative">
        <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400">
            <svg class="w-12 h-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 002-2h2a2 2 0 002 2"></path></svg>
            <p>Load data or select an FTA ID to begin visualization.</p>
        </div>
        <svg id="main-svg" class="w-full h-full"></svg>
    </main>

    <script>
        // Sample data for fallback and structure reference
        const sampleRows = [
            ["FTA ID", "Event ID", "Event Description", "ASIL", "AND Children", "OR Children", "Prob.", "Cutset ID", "Cutset Desc"],
            ["FFTA1", "SG1", "Violation of SG1: Prevent unintended acceleration above driver request.", "ASIL D", "E1,E2", "", "1e-08", "", ""],
            ["FFTA1", "E1", "e-stop fails", "ASIL C (D)", "", "", "1e-07", "FSR1.1", "The e-stop (safety mechanism independent from VCU) shall return the vehicle to the safe state of zero torque"],
            ["FFTA1", "E2", "MCU receives torque request unintended by driver", "ASIL A(D)", "", "E3,E4,E5", "1e-05", "FSR1.2", "MCU shall not provide torque if not commanded by driver"],
            ["FFTA1", "E3", "implausible or invalid accelerator pedal signal", "ASIL A(D)", "", "", "2e-06", "FSR1.3", "The VCU shall detect implausible or invalid accelerator pedal position input within the Fault Tolerant Time Interval (FTTI).."],
            ["FFTA1", "E4", "brake interlock fails", "ASIL A(D)", "", "", "5e-06", "FSR1.4", "VCU commands 0 torque when brake pedal applied"],
            ["FFTA1", "E5", "loss or corruption of communication results in unintended torque command", "ASIL A(D)", "", "", "3e-06", "FSR1.5", "MCU loss of CAN signal triggers timeout to 0 torque safe state within FTTI"]
        ];

        let officeLoaded = false;
        let tablesLoaded = false;
        let currentFtaId = "FFTA1"; 
        let fullDataStore = []; 
        
        window.onload = () => {
            document.getElementById('btn-sample').onclick = renderSampleData;
            document.getElementById('btn-sync').onclick = handleExcelSync;
            document.getElementById('fta-id-select').onchange = () => {
                filterAndRender(fullDataStore); 
            };
            renderSampleData();
        };
        
        function extractAndPopulateFtaIds(rows) {
            if (!rows || rows.length < 2) return;
            const headerRow = rows[0];
            const dataBodyValues = rows.slice(1);
            const header = headerRow.map(h => String(h).trim().toLowerCase()); 
            const ftaIdColumnIndex = header.findIndex(h => h.includes("fta id"));

            if (ftaIdColumnIndex === -1) return;

            const uniqueIds = new Set();
            dataBodyValues.forEach(row => {
                const ftaId = String(row[ftaIdColumnIndex] || "").trim().toUpperCase();
                if (ftaId) uniqueIds.add(ftaId);
            });

            const dropdown = document.getElementById('fta-id-select');
            dropdown.innerHTML = ''; 
            const sortedIds = Array.from(uniqueIds).sort();
            sortedIds.forEach(id => {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = id;
                dropdown.appendChild(option);
            });
            
            if (sortedIds.includes(currentFtaId)) {
                dropdown.value = currentFtaId;
            } else if (sortedIds.length > 0) {
                currentFtaId = sortedIds[0];
                dropdown.value = currentFtaId;
            } else {
                dropdown.innerHTML = '<option value="">-- No IDs Found --</option>';
                currentFtaId = "";
            }
        }
        
        function filterAndRender(fullRows) {
            if (!fullRows || fullRows.length < 2) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }
            const ftaIdSelect = document.getElementById('fta-id-select');
            currentFtaId = ftaIdSelect.value;
            if (!currentFtaId) {
                updateStatus(`Select an FTA ID`, "bg-red-500 text-white");
                return;
            }
            const headerRow = fullRows[0];
            const dataBodyValues = fullRows.slice(1);
            const header = headerRow.map(h => String(h).trim().toLowerCase()); 
            const ftaIdColumnIndex = header.findIndex(h => h.includes("fta id"));
            let filteredValues = [headerRow]; 
            
            if (ftaIdColumnIndex !== -1 && currentFtaId) {
                const filteredData = dataBodyValues.filter(row => 
                    row.length > ftaIdColumnIndex && String(row[ftaIdColumnIndex] || "").trim().toUpperCase() === currentFtaId.toUpperCase()
                );
                filteredValues = filteredValues.concat(filteredData);
            } else {
                filteredValues = fullRows;
            }
            
            renderData(filteredValues);
            document.getElementById('empty-state').classList.add('hidden');
            const source = fullDataStore === sampleRows ? 'Sample' : 'Excel';
            updateStatus(`Rendered ${filteredValues.length - 1} Events (ID: ${currentFtaId}, Source: ${source})`, "bg-green-600 text-white");
        }

        function renderSampleData() {
            fullDataStore = sampleRows;
            extractAndPopulateFtaIds(fullDataStore);
            filterAndRender(fullDataStore);
        }

        async function handleExcelSync() {
            if (!officeLoaded) {
                updateStatus("Loading Excel API...", "bg-gray-600 text-white");
                const script = document.createElement('script');
                script.src = "https://appsforoffice.microsoft.com/lib/1/hosted/office.js";
                script.onload = () => {
                    Office.onReady(async (info) => {
                        officeLoaded = true;
                        updateStatus("Excel API Ready", "bg-green-500 text-white");
                        await populateTableDropdown();
                        performExcelRead();
                    });
                };
                document.head.appendChild(script);
            } else {
                if (!tablesLoaded) await populateTableDropdown();
                performExcelRead();
            }
        }
        
        async function populateTableDropdown() {
            updateStatus("Scanning Workbook...", "bg-blue-500 text-white");
            const dropdown = document.getElementById('table-select');
            dropdown.innerHTML = '<option value="">-- Loading --</option>'; 

            try {
                await Excel.run(async (context) => {
                    // Search entire workbook instead of just active sheet
                    const tables = context.workbook.tables.load("name");
                    await context.sync();

                    dropdown.innerHTML = ''; 
                    if (tables.items.length === 0) {
                        dropdown.innerHTML = '<option value="">-- No Tables Found --</option>';
                        tablesLoaded = true;
                        updateStatus("No Tables Found", "bg-yellow-600 text-white");
                        return;
                    }

                    tables.items.forEach(table => {
                        const option = document.createElement('option');
                        option.value = table.name;
                        option.textContent = table.name;
                        dropdown.appendChild(option);
                    });

                    // Search for "FTA" (case-insensitive) as the preferred default
                    const defaultTable = tables.items.find(t => t.name.toUpperCase() === "FTA") || 
                                         tables.items.find(t => t.name.toUpperCase() === "FTA_DATA") || 
                                         tables.items[0];
                    if (defaultTable) {
                        dropdown.value = defaultTable.name;
                        updateStatus(`Tables Ready`, "bg-green-500 text-white");
                    }
                    tablesLoaded = true;
                });
            } catch (error) {
                dropdown.innerHTML = '<option value="">-- Error Loading Tables --</option>';
                updateStatus("Discovery Error", "bg-red-600 text-white");
            }
        }

        async function performExcelRead() {
            const selectedTableName = document.getElementById('table-select').value;
            if (!selectedTableName) return;
            updateStatus(`Reading: ${selectedTableName}`, "bg-yellow-500 text-black");

            try {
                await Excel.run(async (context) => {
                    // Accessing table globally from workbook
                    let table = context.workbook.tables.getItem(selectedTableName);
                    const headerRange = table.getHeaderRowRange();
                    const dataRange = table.getDataBodyRange();
                    headerRange.load("values");
                    dataRange.load("values");
                    await context.sync();

                    const allTableRows = [headerRange.values[0], ...dataRange.values];
                    if (allTableRows.length < 2) {
                        updateStatus("Table Empty", "bg-red-500 text-white");
                        return;
                    }
                    fullDataStore = allTableRows;
                    extractAndPopulateFtaIds(fullDataStore); 
                    filterAndRender(fullDataStore);
                });
            } catch (error) {
                updateStatus("Excel Read Error", "bg-red-600 text-white");
            }
        }

        function updateStatus(text, classes) {
            const pill = document.getElementById('status-pill');
            pill.innerText = text;
            pill.className = `text-xs px-0.5 py-0 rounded tracking-widest ${classes}`;
        }

        function getAsilColor(asil) {
            if (!asil) return "#C0E6F5";
            const a = asil.toUpperCase();
            if (a.includes("ASIL D")) return "#FF3399";
            if (a.includes("ASIL C")) return "#D86DCD";
            if (a.includes("ASIL B")) return "#9966FF";
            if (a.includes("ASIL A")) return "#4D93D9";
            return "#C0E6F5";
        }

        function wrapText(text, width, charWidth = 5) {
            if (!text) return [];
            const words = text.split(/\s+/);
            const lines = [];
            let currentLine = words[0];
            for (let i = 1; i < words.length; i++) {
                if ((currentLine + " " + words[i]).length * charWidth < width) {
                    currentLine += " " + words[i];
                } else {
                    lines.push(currentLine);
                    currentLine = words[i];
                }
            }
            lines.push(currentLine);
            return lines;
        }

        function transformChildrenListToHierarchy(rows, indices) {
            const rawData = rows.slice(1);
            const d3Nodes = new Map(); 
            const definedEventIds = new Set(rawData.map(r => String(r[indices.id] || "").trim()).filter(id => id.length > 0));

            for (const r of rawData) {
                const eventId = String(r[indices.id] || "").trim();
                const andChildrenStr = String(r[indices.andChildren] || "").trim();
                const orChildrenStr = String(r[indices.orChildren] || "").trim();
                if (!eventId) continue;

                let outputNode = d3Nodes.get(eventId) || { id: eventId, parentId: 'TEMP_ROOT_CANDIDATE_PLACEHOLDER', type: 'EVENT', isGate: false };
                Object.assign(outputNode, {
                    label: String(r[indices.label] || eventId),
                    asil: String(r[indices.asil] || ""),
                    cutsetId: String(r[indices.cutsetId] || ""),
                    cutsetDesc: String(r[indices.cutsetDesc] || ""),
                    prob: indices.prob !== -1 ? String(r[indices.prob] || "").trim() : "",
                });
                d3Nodes.set(eventId, outputNode);
                
                ["and", "or"].forEach(type => {
                    const col = type === "and" ? indices.andChildren : indices.orChildren;
                    const childrenStr = String(r[col] || "").trim();
                    const children = childrenStr ? childrenStr.split(',').map(s => s.trim()).filter(s => s) : [];
                    if (children.length > 0) {
                        const gateId = `${eventId}_${type.toUpperCase()}`;
                        d3Nodes.set(gateId, { id: gateId, parentId: eventId, type: type.toUpperCase(), label: type.toUpperCase(), isGate: true });
                        children.forEach(childId => {
                            const childNode = { id: childId, parentId: gateId, type: definedEventIds.has(childId) ? 'EVENT' : 'BASIC', label: childId, asil: definedEventIds.has(childId) ? 'TRANSFERRED' : 'QM', prob: "", isGate: false };
                            const existing = d3Nodes.get(childId);
                            if (existing) { existing.parentId = childNode.parentId; existing.type = childNode.type; }
                            else d3Nodes.set(childId, childNode);
                        });
                    }
                });
            }
            let rootNode = Array.from(d3Nodes.values()).find(n => n.parentId === 'TEMP_ROOT_CANDIDATE_PLACEHOLDER' && !n.isGate);
            if (rootNode) rootNode.parentId = null;
            return Array.from(d3Nodes.values()).filter(n => n.parentId !== 'TEMP_ROOT_CANDIDATE_PLACEHOLDER');
        }

        function renderData(rows) {
            if (!rows || rows.length < 2) return;
            const svg = d3.select("#main-svg");
            svg.selectAll("*").remove();
            const container = document.getElementById('canvas-container');
            const g = svg.append("g");
            svg.call(d3.zoom().scaleExtent([0.1, 2]).on("zoom", (e) => g.attr("transform", e.transform)));

            const header = rows[0].map(h => String(h).trim().toLowerCase()); 
            const findIndex = (k) => header.findIndex(h => h.includes(k.toLowerCase()));
            const indices = { id: findIndex("event id"), andChildren: findIndex("and children"), orChildren: findIndex("or children"), label: findIndex("label") === -1 ? findIndex("event description") : findIndex("label"), asil: findIndex("asil"), cutsetId: findIndex("cutset id"), cutsetDesc: findIndex("cutset desc"), prob: findIndex("prob") };
            
            const transformedData = transformChildrenListToHierarchy(rows, indices);
            const root = d3.stratify().id(d => d.id).parentId(d => d.parentId)(transformedData);
            d3.tree().nodeSize([250, 100])(root);

            const boxW = 160, boxH = 65, headerH = 15, borderRadius = 4, FIXED_V_DROP = 25;
            
            g.selectAll(".link").data(root.links()).enter().append("path").attr("class", "link")
                .attr("d", d => {
                    const linkStartY = d.source.data.isGate ? d.source.y + 7.5 : d.source.y + (boxH / 2);
                    if (d.target.data.isGate) {
                        const busY = d.source.y + (boxH / 2) + FIXED_V_DROP;
                        d.target.data.busY = busY;
                        return `M${d.source.x},${d.source.y + (boxH/2)} L${d.source.x},${busY} L${d.target.x},${busY}`;
                    } else if (d.source.data.isGate) {
                        const gateBusY = d.source.data.busY, gateBottom = gateBusY + 7.5, childTop = d.target.y - (boxH / 2);
                        const busY_children = gateBottom + (childTop - gateBottom) * 0.25;
                        return `M${d.source.x},${gateBottom} L${d.source.x},${busY_children} L${d.target.x},${busY_children} L${d.target.x},${childTop}`;
                    }
                    return "";
                });

            const node = g.selectAll(".node").data(root.descendants()).enter().append("g")
                .attr("class", d => `node ${d.data.isGate ? 'gate' : 'event'}`).attr("transform", d => `translate(${d.x},${d.y})`);

            node.filter(d => d.data.isGate).each(function(d) {
                const el = d3.select(this), type = d.data.type, busY = d.data.busY, offsetY = busY - d.y; 
                const path = type === 'AND' ? "M-15,15 L15,15 L15,0 A15,15 0 0,0 -15,0 Z" : "M-15,15 Q-15,-10 0,-15 Q15,-10 15,15 Q0,7 -15,15 Z";
                el.append("path").attr("class", type === 'AND' ? "gate-and" : "gate-or").attr("d", path).attr("transform", `translate(0, ${offsetY})`);
                el.append("text").attr("class", "gate-text").attr("text-anchor", "middle").attr("y", offsetY + 3).text(type);
            });

            const eventNodes = node.filter(d => !d.data.isGate);
            eventNodes.append("rect").attr("class", "node-box").attr("width", boxW).attr("height", boxH).attr("x", -boxW/2).attr("y", -boxH/2).attr("rx", borderRadius).attr("ry", borderRadius);
            eventNodes.append("rect").attr("class", "node-header").attr("width", boxW).attr("height", headerH).attr("x", -boxW/2).attr("y", -boxH/2).attr("rx", borderRadius).attr("ry", borderRadius).attr("fill", d => getAsilColor(d.data.asil));
            eventNodes.append("text").attr("class", "node-id-text").attr("text-anchor", "start").attr("x", -boxW/2 + 5).attr("y", -boxH/2 + 11).text(d => `${d.data.id} : ${d.data.asil || 'QM'}`);
            eventNodes.each(function(d) {
                const el = d3.select(this), lines = wrapText(d.data.label, boxW - 15, 5.5);
                lines.slice(0, 4).forEach((line, i) => { el.append("text").attr("class", "node-desc-text").attr("text-anchor", "start").attr("x", -boxW/2 + 5).attr("y", -boxH/2 + headerH + 12 + (i * 11)).text(line); });
            });
            eventNodes.filter(d => d.data.prob).append("text").attr("class", "node-desc-text").attr("text-anchor", "end").attr("x", boxW/2 - 5).attr("y", boxH/2 - 5).text(d => `P: ${d.data.prob}`);

            eventNodes.each(function(d) {
                if (d.data.cutsetId) {
                    const el = d3.select(this), lineY = -boxH/2 - 60, startX = -boxW/2 - 40;
                    el.append("line").attr("class", "cutset-line").attr("x1", startX).attr("y1", lineY).attr("x2", 10).attr("y2", lineY);
                    wrapText(`${d.data.cutsetId}: ${d.data.cutsetDesc}`, Math.abs(startX) + 5, 4.8).forEach((line, i) => {
                        el.append("text").attr("class", "cutset-text").attr("text-anchor", "start").attr("x", startX + 2).attr("y", lineY + 10 + (i * 9)).text(line);
                    });
                }
            });
            svg.transition().duration(500).call(d3.zoom().transform, d3.zoomIdentity.translate(container.clientWidth/2, 100).scale(0.7));
        }
    </script>
</body>
</html>
